apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-backend
  namespace: ontology
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ontology-backend
  template:
    metadata:
      labels:
        app: ontology-backend
    spec:
      containers:
        - name: backend
          image: ontology-agent-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ontology-agent-config
            - secretRef:
                name: ontology-agent-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-backend
  namespace: ontology
spec:
  selector:
    app: ontology-backend
  ports:
    - port: 8000
      targetPort: 8000
