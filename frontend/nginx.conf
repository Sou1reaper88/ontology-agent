server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到后端 API（docker-compose 网络内服务名 backend）
    location /auth/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /query/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /execute/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /users/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /roles/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /permissions/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
}
